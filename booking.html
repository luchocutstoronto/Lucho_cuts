<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Appointment | Lucho Cuts</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:#d11a2a;line-height:1.6}
a{text-decoration:none;color:inherit}
.container{width:min(1050px,92%);margin:auto}
header{height:72px;position:sticky;top:0;z-index:100;background:rgba(255,255,255,.97);border-bottom:1px solid #eee;backdrop-filter:blur(10px)}
nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;flex-direction:column;line-height:1.05}
.logo{font-size:1.5rem;font-weight:900;letter-spacing:1px}
.location{font-size:.72rem;font-weight:700;margin-top:5px;letter-spacing:.5px}
.nav-links{display:flex;align-items:center;gap:18px;font-size:.9rem;font-weight:800}
.nav-links a:hover{text-decoration:underline}
.btn{display:inline-block;border:0;border-radius:999px;background:#d11a2a;color:#fff;padding:13px 23px;font-weight:900;cursor:pointer;font:inherit}
.page{min-height:calc(100vh - 72px);padding:70px 0}
.section-title{text-align:center;margin-bottom:35px}
.section-title small{font-weight:900;letter-spacing:2px;text-transform:uppercase}
.section-title h1,.section-title h2{font-size:clamp(2.3rem,6vw,4rem);margin-top:5px}
@media(max-width:700px){
  .nav-links{gap:9px;font-size:.72rem}
}
.booking-shell{max-width:900px;margin:auto}
.booking-card{border:1px solid #eee;border-radius:24px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.07);background:#fff}
.service{display:flex;justify-content:space-between;align-items:center;border:1px solid #efc5ca;border-radius:16px;padding:17px;margin-bottom:24px;font-weight:900}
.calendar-frame{width:100%;height:720px;border:1px solid #eee;border-radius:18px;background:#fafafa}
.fallback{text-align:center;margin-top:18px}
.fallback p{margin-bottom:12px;font-weight:700}
@media(max-width:700px){
  .booking-card{padding:16px}
  .calendar-frame{height:680px}
}
</style>
</head>
<body>
<header>
  <div class="container">
    <nav>
      <div class="brand">
        <a class="logo" href="index.html">LUCHO CUTS</a>
        <span class="location">Toronto, Ontario</span>
      </div>
      <div class="nav-links">
        <a href="booking.html">Book</a>
        <a href="work.html#gallery">Gallery</a>
        <a href="work.html#about">About</a>
        <a href="https://www.instagram.com/luchoo.cuts/" target="_blank" rel="noopener noreferrer">Instagram</a>
      </div>
    </nav>
  </div>
</header>
<main class="page">
  <div class="container booking-shell">
    <div class="section-title">
      <small>Booking</small>
      <h1>Book Appointment</h1>
    </div>
    <div class="booking-card">
      <div class="service">
        <span>Haircut</span>
        <span>FREE</span>
      </div>
      <iframe
        class="calendar-frame"
        src="https://calendar.app.google/nCTBEanEgjzhTg1D6"
        title="Lucho Cuts booking calendar"
        loading="lazy">
      </iframe>
      <div class="fallback">
        <p>If the calendar does not load here, open the booking page directly.</p>
        <a class="btn" href="https://calendar.app.google/nCTBEanEgjzhTg1D6" target="_blank" rel="noopener noreferrer">See Available Times</a>
      </div>
    </div>
  </div>
</main>
</body>
</html>
